<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carbon Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="container py-5">

  <h1>Carbon Footprint Calculator</h1>
  <p>Enter your weekly car travel distance.</p>

  <label for="distance" class="form-label">
    Kilometers driven per week
  </label>
  <input type="number" id="distance" class="form-control mb-3"
         min="0" placeholder="e.g. 100">

  <button class="btn btn-success" onclick="calculateCarbon()">
    Calculate
  </button>

  <p id="result" class="mt-4"></p>

  <script>
    function calculateCarbon() {
      const distance = Number(document.getElementById("distance").value);
      const result = document.getElementById("result");

      if (document.getElementById("distance").value === "" ||
          !Number.isFinite(distance) || distance < 0) {
        result.textContent = "Please enter a valid distance.";
        return;
      }

      // Illustrative estimate: 0.2 kg CO2 per kilometer
      const emissions = distance * 0.2;

      result.textContent =
        "Estimated emissions: " + emissions.toFixed(2) + " kg CO₂ per week.";
    }
  </script>

</body>
</html>
